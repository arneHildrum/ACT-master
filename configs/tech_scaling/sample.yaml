name: Tech scaling configuration file sample

# specify the file path that this tech scaling configuration works with
compatible_with: server/dellr740/top.yaml

# specify which device paths to scale and to what
scaling_paths:
  # only scale specific logic instance to 14 nm
  cpu0.main:
    process: 14nm

  # scale all SSDs to 20nm
  ssd:
    process: nand_20nm

  # scale only dram main2
  dram.main2:
    process: lpddr4
